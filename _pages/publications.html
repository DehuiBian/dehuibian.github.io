<style>
.pub-chart-wrap {
  display: flex;
  align-items: stretch;
  margin: 1.5em 0 2em;
}
.pub-yaxis {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  width: 2.2em;
  padding-bottom: 1.6em;
}
.pub-ylabel {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 0.85em;
  color: #333;
  white-space: nowrap;
}
.pub-yaxis-right {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  width: 2.2em;
  padding-bottom: 1.6em;
}
.pub-ylabel-right {
  writing-mode: vertical-rl;
  transform: rotate(90deg);
  font-size: 0.85em;
  color: #c0392b;
  white-space: nowrap;
}
.pub-chart-area {
  flex: 1;
  position: relative;
}
.pub-chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  height: 220px;
  padding: 0 0.5em;
  border-left: 1px solid #999;
  border-bottom: 1px solid #999;
  position: relative;
  box-sizing: border-box;
}
.pub-bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  width: 10%;
  position: relative;
  z-index: 2;
}
.pub-count {
  font-size: 0.8em;
  margin-bottom: 4px;
  color: #333;
}
.pub-fill {
  width: 60%;
  background: #4a90d9;
  border-radius: 3px 3px 0 0;
}
.pub-year {
  font-size: 0.8em;
  margin-top: 6px;
  color: #555;
  position: absolute;
  bottom: -1.6em;
}
.pub-xlabel {
  text-align: center;
  font-size: 0.85em;
  color: #333;
  margin-top: 2.2em;
}
/* 被引折线层 */
.pub-citation-svg {
  position: absolute;
  left: 0.5em;
  right: 0.5em;
  top: 0;
  height: 220px;
  width: calc(100% - 1em);
  pointer-events: none;
  z-index: 1;
  overflow: visible;
}
.pub-citation-svg polyline {
  fill: none;
  stroke: #c0392b;
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.pub-citation-svg circle {
  fill: #c0392b;
  stroke: #fff;
  stroke-width: 1.5;
}
.pub-citation-label {
  font-size: 0.7em;
  fill: #c0392b;
  text-anchor: middle;
  dominant-baseline: auto;
}
.pub-legend {
  display: flex;
  justify-content: center;
  gap: 1.5em;
  font-size: 0.82em;
  color: #333;
  margin-top: 0.3em;
}
.pub-legend .swatch {
  display: inline-block;
  width: 0.9em;
  height: 0.9em;
  margin-right: 0.3em;
  vertical-align: -0.1em;
}
.pub-legend .swatch.bar {
  background: #4a90d9;
  border-radius: 2px;
}
.pub-legend .swatch.line {
  background: #c0392b;
  border-radius: 50%;
}
</style>

<div class="pub-chart-wrap">
  <!-- 左轴：发文数量 -->
  <div class="pub-yaxis">
    <span class="pub-ylabel">Number of Publications</span>
  </div>

  <div class="pub-chart-area">
    <div class="pub-chart">
      <!-- 柱状图：每年发文数量（左轴 0–6） -->
      <div class="pub-bar"><span class="pub-count">2</span><div class="pub-fill" style="height:33.3%"></div><span class="pub-year">2020</span></div>
      <div class="pub-bar"><span class="pub-count">3</span><div class="pub-fill" style="height:50%"></div><span class="pub-year">2021</span></div>
      <div class="pub-bar"><span class="pub-count">5</span><div class="pub-fill" style="height:83.3%"></div><span class="pub-year">2022</span></div>
      <div class="pub-bar"><span class="pub-count">5</span><div class="pub-fill" style="height:83.3%"></div><span class="pub-year">2023</span></div>
      <div class="pub-bar"><span class="pub-count">2</span><div class="pub-fill" style="height:33.3%"></div><span class="pub-year">2024</span></div>
      <div class="pub-bar"><span class="pub-count">1</span><div class="pub-fill" style="height:16.7%"></div><span class="pub-year">2025</span></div>
      <div class="pub-bar"><span class="pub-count">3</span><div class="pub-fill" style="height:50%"></div><span class="pub-year">2026</span></div>
      <div class="pub-bar"><span class="pub-count">2</span><div class="pub-fill" style="height:33.3%"></div><span class="pub-year">2027</span></div>

      <!-- 折线图：每年被引次数（右轴 0–140），数据来自 Scopus -->
      <svg class="pub-citation-svg" viewBox="0 0 800 220" preserveAspectRatio="none">
        <!-- 坐标：8 个年份，x 取 50,150,...,750；y = 220 - (被引/140)*220 -->
        <polyline points="
          50,216.86
          150,194.86
          250,135.14
          350,108.43
          450,55.00
          550,9.43
          650,73.86
          750,213.71
        " />
        <circle cx="50" cy="216.86" r="4"/>
        <circle cx="150" cy="194.86" r="4"/>
        <circle cx="250" cy="135.14" r="4"/>
        <circle cx="350" cy="108.43" r="4"/>
        <circle cx="450" cy="55.00" r="4"/>
        <circle cx="550" cy="9.43" r="4"/>
        <circle cx="650" cy="73.86" r="4"/>
        <circle cx="750" cy="213.71" r="4"/>
        <text class="pub-citation-label" x="50" y="206">2</text>
        <text class="pub-citation-label" x="150" y="184">16</text>
        <text class="pub-citation-label" x="250" y="124">54</text>
        <text class="pub-citation-label" x="350" y="97">71</text>
        <text class="pub-citation-label" x="450" y="44">105</text>
        <text class="pub-citation-label" x="550" y="-2">134</text>
        <text class="pub-citation-label" x="650" y="62">93</text>
        <text class="pub-citation-label" x="750" y="202">4</text>
      </svg>
    </div>
    <div class="pub-xlabel">Year</div>
    <div class="pub-legend">
      <span><span class="swatch bar"></span>Number of Publications (left axis)</span>
      <span><span class="swatch line"></span>Citations per Year — Scopus (right axis)</span>
    </div>
  </div>

  <!-- 右轴：被引次数 -->
  <div class="pub-yaxis-right">
    <span class="pub-ylabel-right">Citations per Year (Scopus)</span>
  </div>
</div>
